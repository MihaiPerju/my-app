{{- if .Values.gateway.enabled }}
{{- $g := .Values.global | default dict }}
{{- $wl := .Values.gateway }}
{{- $secret := include "common.secretName" . }}
{{- $keys := $g.secrets.keys }}
{{- $cmName := include "common.componentName" (dict "root" . "component" "gateway") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $cmName }}
  labels:
    {{- include "common.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
  {{- with $g.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $wl.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.componentSelectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.componentSelectorLabels" (dict "root" . "component" "gateway") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway-configmap.yaml") . | sha256sum }}
        {{- with $wl.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "common.serviceAccountName" . }}
      automountServiceAccountToken: {{ $g.serviceAccount.automountServiceAccountToken }}
      {{- include "common.imagePullSecrets" (dict "root" .) | nindent 6 }}
      securityContext:
        {{- include "common.podSecurityContext" (dict "root" . "workload" $wl) | nindent 8 }}
      initContainers:
        - name: copy-conf
          image: {{ include "common.image" (dict "root" . "workload" $wl) }}
          imagePullPolicy: {{ include "common.imagePullPolicy" (dict "root" . "workload" $wl) }}
          # `cp -R`, never `cp -a`. -a implies --preserve=timestamps, so cp calls utimensat
          # on the destination directory. The emptyDir root is owned by root:<fsGroup> and this
          # container runs as uid 1000, so that call is EPERM and the init container dies before
          # APISIX starts. Timestamps carry no meaning here; the mode bits -R keeps are enough.
          command: ["sh", "-c", "cp -R /usr/local/apisix/conf/. /conf-writable/"]
          securityContext:
            {{- include "common.containerSecurityContext" (dict "root" . "workload" $wl) | nindent 12 }}
          resources:
            {{- toYaml $wl.resources | nindent 12 }}
          volumeMounts:
            - name: conf
              mountPath: /conf-writable
      containers:
        - name: gateway
          image: {{ include "common.image" (dict "root" . "workload" $wl) }}
          imagePullPolicy: {{ include "common.imagePullPolicy" (dict "root" . "workload" $wl) }}
          securityContext:
            {{- include "common.containerSecurityContext" (dict "root" . "workload" $wl) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $wl.containerPort }}
              protocol: TCP
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ index $keys .Values.auth.oidc.clientSecretKey }}
            # Distinct from the client secret: a leaked cookie-signing key must not
            # also be valid credentials at the IdP.
            - name: GATEWAY_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ index $keys .Values.auth.oidc.sessionSecretKey }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml $wl.resources | nindent 12 }}
          volumeMounts:
            - name: conf
              mountPath: /usr/local/apisix/conf
            - name: logs
              mountPath: /usr/local/apisix/logs
            - name: gateway-config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
            - name: gateway-config
              mountPath: /usr/local/apisix/conf/apisix.yaml
              subPath: apisix.yaml
            # nginx creates its cache and temp directories at startup, which the read-only
            # rootfs forbids: APISIX exits 1 before it listens ("mkdir() ... failed (30:
            # Read-only file system)"). The gateway is parent-owned and hand-rolled, so it must
            # request every writable mount itself.
            - name: tmp
              mountPath: /tmp
            {{- range $dir := list "client_body_temp" "proxy_temp" "fastcgi_temp" "uwsgi_temp" "scgi_temp" }}
            - name: nginx-temp
              mountPath: /usr/local/apisix/{{ $dir }}
              subPath: {{ $dir }}
            {{- end }}
      volumes:
        - name: conf
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
        - name: nginx-temp
          emptyDir:
            medium: Memory
        - name: gateway-config
          configMap:
            name: {{ $cmName }}
      {{- with $wl.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $wl.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $wl.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
