{{- if and .Values.secrets.create (not .Values.secrets.externalSecrets.enabled) }}
{{- $secretName := include "common.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- $pgKey := .Values.global.postgres.auth.passwordSecretKey }}
{{- $pgFromValues := index .Values.secrets.data $pgKey | default "" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.data }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.global.postgres.deploy (eq $pgFromValues "") }}
  {{- if and $existing (index $existing.data $pgKey) }}
  {{ $pgKey }}: {{ index $existing.data $pgKey | b64dec | quote }}
  {{- else }}
  {{ $pgKey }}: {{ randAlphaNum 24 | quote }}
  {{- end }}
  {{- end }}
{{- end }}
