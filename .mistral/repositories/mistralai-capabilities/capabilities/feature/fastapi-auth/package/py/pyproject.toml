[project]
name = "mistralai-capabilities-feature-fastapi-auth"
version = "0.1.0"
description = "The FastAPI identity surface: the gateway-asserted identity gate, the user-store Protocol seam, and the Postgres user store apps/api mounts. Activated when FastAPI and auth are both effective."
requires-python = ">=3.12,<3.15"
license = "LicenseRef-Proprietary"
dependencies = []

# An optional extra rather than a base dependency: only the API host imports FastAPI. Keeping the
# web framework out of the base distribution lets a consumer install the toolkit without loading it.
[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The dist name is fixed by the CLI convention (= `<registry id>-<kind>-<capability id>`);
# `module-name` decouples the IMPORT path from it. `namespace = true` makes this a PEP-420
# portion so it ships only the `mistralai_capabilities.fastapi_auth` slice alongside the
# sibling caps.
module-name = "mistralai_capabilities.fastapi_auth"
namespace = true
