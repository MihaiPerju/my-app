[project]
name = "mistralai-capabilities-feature-mcp-apps"
version = "0.1.0"
description = "MCP Apps discovery, serving, and self-connector reconciliation for generated applications."
requires-python = ">=3.12,<3.15"
license = "LicenseRef-Proprietary"
dependencies = ["fastmcp>=3", "mistralai>=2.9.4", "pydantic>=2"]


[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mistralai_capabilities.mcp_apps"
namespace = true
