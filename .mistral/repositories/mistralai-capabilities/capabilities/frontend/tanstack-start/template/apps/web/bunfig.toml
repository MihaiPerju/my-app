[test]
# The generated API client is machine-written from the FastAPI OpenAPI spec
# (`bunx nx run fastapi-tanstack-start:gen-types`, drift-checked by the `gen-types-drift` job): testing
# it would test the generator, and its large unreachable surface would otherwise dominate the numbers.
coveragePathIgnorePatterns = ["**/api/generated/**", "**/*.gen.ts", "**/src/test/**"]
coverageSkipTestFiles = true
# No `coverageThreshold` here on purpose: through bun 1.4.0 it is enforced per FILE, not on the total,
# so any value above 0 fails on the first component with no direct test. The aggregate ratchet
# lives in the `ts-checks` job instead, computed from the lcov report emitted below.
coverageReporter = ["text", "lcov"]
