[project]
name = "workflows-app"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "utils",
    "env",
    "mistralai>=2.9.4",
    "mistralai-workflows>=3.15.0",
    "pydantic>=2",
    "structlog>=25",
    "watchfiles>=1.1",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker"

[tool.uv.sources]
utils = { workspace = true }
env = { workspace = true }
# The Socket mirror 403s this name's wheel `.metadata`, and the environment outranks `default =
# true`, so it must be bound to a named index the environment cannot retarget.
mistralai-workflows = { index = "pypi" }

