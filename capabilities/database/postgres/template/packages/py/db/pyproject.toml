[project]
name = "db"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "env",
    "sqlmodel>=0.0.24",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
env = { workspace = true }
