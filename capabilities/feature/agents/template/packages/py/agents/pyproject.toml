[project]
name = "agents"
version = "0.0.1"
requires-python = ">=3.12,<3.15"
dependencies = [
    # The Agents SDK, for the worker's agents overlays (worker/workflows/agents.py, mcp_apps.py) and
    # the file-defined agent project. It lives on a workspace MEMBER, not this capability's package/py
    # toolkit, so `uv sync --all-packages` installs it exactly when the agents capability is selected
    # and a workflows-only worker stays SDK-free. `mistralai-agents` is public on PyPI, so it resolves
    # from the default index with no `[tool.uv.sources]` binding.
    #
    # Exact-pinned: the authoring API and its transitive Unified Harness runtime move fast on the rc
    # line, and this pin must stay identical to the agent project's
    # (apps/worker/src/worker/agents/pyproject.toml) so the checks run the SDK the worker installs.
    "mistralai-agents==1.1.0rc6",
    "httpx>=0.27",
]

[dependency-groups]
# pytest + ty so the agents-owned tests (apps/worker/tests/agents) and the directory-scoped
# `agents:typecheck` run even when the optional `testing` and `code-quality` capabilities are not
# selected. Folded in from the former `packages/py/agents-checks` member so this capability ships
# one dep-only workspace member, not two.
dev = [
    "pytest>=8",
    "ty>=0.0.59",
]

[tool.uv]
package = false
