[project]
name = "utils"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "structlog>=25",
    "opentelemetry-api>=1.39",
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.39",
    "env",
    "mistralai>=2.9.4",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
env = { workspace = true }
