[pytest]
asyncio_mode = auto
addopts = --import-mode=importlib
testpaths =
    tests
    capabilities/backend/fastapi/package/py/tests
    capabilities/backend/workflows/package/py/tests
    capabilities/database/bucket/package/py/tests
    capabilities/deployment/apps/package/py/tests
    capabilities/feature/agents/package/py/tests
    capabilities/feature/evals/package/py/tests
    capabilities/feature/fastapi-workflows-auth/package/py/tests
    capabilities/feature/guardrailing-eval/package/py/tests
    capabilities/feature/document-annotation-ui/package/py/tests
    capabilities/feature/mcp-apps/package/py/tests
    capabilities/feature/search/package/py/tests
    capabilities/base/core/template/packages/py/cli/tests
    capabilities/base/core/template/packages/py/utils/tests
    capabilities/tooling/testing/template/tests
# cli is a src-layout package; point pytest at its src so `import cli` resolves without an install.
pythonpath = capabilities/base/core/template/packages/py/cli/src
